name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (unit, web slice, embedded-Kafka end-to-end)
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"

  docker:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ingest-service, analyzer-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg SERVICE=${{ matrix.service }} -t sentinelops/${{ matrix.service }}:${{ github.sha }} .
