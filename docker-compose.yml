# Full local stack: Kafka (KRaft), Redis, Postgres, Vault (dev mode) and both services.
#   docker compose up --build
#   python3 scripts/simulate.py
services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: local-dev-only
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sentinel"]
      interval: 5s

  vault:
    image: hashicorp/vault:1.18
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
    cap_add: [IPC_LOCK]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s

  # Seeds the analyzer's secrets into Vault, the way a platform team would.
  vault-init:
    image: hashicorp/vault:1.18
    depends_on:
      vault: { condition: service_healthy }
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    entrypoint: ["sh", "/seed.sh"]
    volumes:
      - ./deploy/vault/seed.sh:/seed.sh:ro

  ingest-service:
    build: { context: ., args: { SERVICE: ingest-service } }
    ports: ["8081:8081"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }

  analyzer-service:
    build: { context: ., args: { SERVICE: analyzer-service } }
    ports: ["8082:8082"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      DB_URL: jdbc:postgresql://postgres:5432/sentinel
      DB_USERNAME: sentinel
      # DB_PASSWORD and MCP_TOKEN are deliberately absent: they are read from Vault.
      VAULT_ENABLED: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      vault-init: { condition: service_completed_successfully }
