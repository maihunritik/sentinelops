server:
  port: 8082

spring:
  application:
    name: analyzer-service
  config:
    # Secrets (DB password, MCP token) come from Vault KV at secret/analyzer-service when enabled.
    import: optional:vault://
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_ADDR:http://localhost:8200}
      authentication: ${VAULT_AUTH:TOKEN}
      token: ${VAULT_TOKEN:}
      kubernetes:
        role: ${VAULT_K8S_ROLE:analyzer-service}
      kv:
        enabled: true
        backend: secret
        default-context: analyzer-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: io.sentinelops.common.TelemetryEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: io.sentinelops.common
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # value serializer: see KafkaJsonConfig (Spring's ObjectMapper, no type headers)
      acks: all
  datasource:
    url: ${DB_URL:jdbc:h2:mem:sentinel;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cache:
    type: ${CACHE_TYPE:redis}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

sentinel:
  kafka:
    group-id: analyzer
    concurrency: 3
    replicas: 1
  detection:
    window: PT1M
    evaluation-interval: PT5S
    min-samples: 20
    error-rate-threshold: 0.2
    latency-factor: 2.0
    latency-floor-ms: 250
    baseline-alpha: 0.2
    recovery-evaluations: 2
  mcp:
    token: ${MCP_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    vault:
      enabled: ${VAULT_ENABLED:false}
