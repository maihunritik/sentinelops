apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinelops-config
  namespace: sentinelops
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka.kafka.svc.cluster.local:9092
  REDIS_HOST: redis.sentinelops.svc.cluster.local
  DB_URL: jdbc:postgresql://postgres.sentinelops.svc.cluster.local:5432/sentinel
  DB_USERNAME: sentinel
  VAULT_ENABLED: "true"
  VAULT_ADDR: http://vault.vault.svc.cluster.local:8200
  VAULT_AUTH: KUBERNETES
  VAULT_K8S_ROLE: analyzer-service
