apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-service
  namespace: sentinelops
  labels: { app: ingest-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ingest-service }
  template:
    metadata:
      labels: { app: ingest-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ingest-service
          image: ghcr.io/maihunritik/sentinelops-ingest:latest
          ports: [{ containerPort: 8081, name: http }]
          envFrom:
            - configMapRef: { name: sentinelops-config }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-service
  namespace: sentinelops
spec:
  selector: { app: ingest-service }
  ports: [{ port: 80, targetPort: http, name: http }]
---
# Stateless, so it scales freely on CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingest-service
  namespace: sentinelops
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ingest-service }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
