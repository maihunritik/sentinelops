server:
  port: 8081

spring:
  application:
    name: ingest-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # value serializer: see KafkaJsonConfig (Spring's ObjectMapper, no type headers)
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

sentinel:
  dedup:
    store: ${DEDUP_STORE:redis}
    ttl: PT10M
  kafka:
    partitions: 6
    replicas: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
